name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api-contract/package-lock.json
            frontend/package-lock.json
      - name: Install contract dependencies
        run: npm --prefix api-contract ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Generate OpenAPI and server and client artifacts
        run: npm --prefix api-contract run generate:all
      - name: Verify generated artifacts are current
        run: |
          git diff --exit-code -- api-contract/tsp-output src/Calendar.Api/Generated/OpenApi frontend/src/generated/api
          test -z "$(git ls-files --others --exclude-standard -- api-contract/tsp-output src/Calendar.Api/Generated/OpenApi frontend/src/generated/api)"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore Calendar.slnx --configfile NuGet.Config
      - name: Verify formatting
        run: dotnet format Calendar.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Calendar.slnx -c Release -warnaserror --no-restore
      - name: Run smoke test
        run: dotnet test Calendar.slnx -c Release --no-build --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
